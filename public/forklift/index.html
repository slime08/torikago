<style>
  body { background:#24262b; color:#e8e9eb; font-family:sans-serif; margin:0;

  #clear-rank { font-size:34px; font-weight:bold; }
  #clear-moves { font-size:15px; font-weight:normal; color:#e8e9eb; }
  #clear { display:none; position:absolute; top:38%; left:50%; transform:translate(-50%,-50%);

           padding:16px 22px; border-radius:10px; text-align:center; white-space:nowrap; z-index:3; }
  #clear-sub { font-size:14px; font-weight:normal; }

  #title-screen .game-title { font-size:27px; font-weight:bold; margin:0; color:#ffd94d; }
  #title-screen .game-sub { font-size:13px; color:#b9bcc2; margin:0 0 2px; }
  #title-visual { position:relative; width:96px; height:168px; }
  #title-visual img { position:absolute; left:50%; transform:translateX(-50%);
           width:96px; image-rendering:pixelated; }
  #btn-start { background:#e8a812; color:#24262b; border:none; border-radius:8px;
           font-size:17px; font-weight:bold; padding:11px 30px; cursor:pointer; }
  #stage-btns { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  #stage-btns button { background:#3a3d44; color:#e8e9eb; border:1px solid #55585f;
           border-radius:8px; font-size:13px; padding:8px 12px; cursor:pointer; }
  #stage-btns .badge { font-weight:bold; }
  #rank-progress { min-height:16px; margin:6px 0 0; }
  .hint { font-size:13px; color:#b9bcc2; margin-top:10px; text-align:center; line-height:1.7; }

<body>
<h1>フォークリフト倉庫パズル</h1>
<p id="stage-label"></p>
<p id="moves-label"></p>
<div id="wrap">
  <canvas id="game" width="480" height="432"></canvas>
  <div id="title-screen">
    <p class="game-title">フォークリフト<br>倉庫パズル</p>
    <div id="title-visual"></div>
    <p class="game-sub">段ボールを運んで倉庫を片付けるパズル（全5ステージ）</p>
    <button id="btn-start">▶ スタート</button>
    <div id="stage-btns"></div>
    <p id="rank-progress" class="game-sub"></p>
  </div>
  <div id="clear"><span id="clear-rank"></span><br><span id="clear-title">クリア！</span><br><span id="clear-moves"></span><br><span id="clear-sub"></span><br><button id="btn-next">次のステージへ →</button></div>
</div>

</div>

</div>

  <button id="btn-title">タイトル</button>
</div>

<script>"use strict";
/* フォークリフト倉庫パズル - コアロジック (Godot版 main.gd の移植)
 * ルール:
 * - フォークリフトは車体1マス＋フォーク1マス
 * - 方向キー: 向いている方向=前進 / 逆=後退 / 横=転回
 * - 前進: フォーク先が壁なら不可。進んだ先でフォークが壁に刺さる場合も不可
 * - 転回: 転回先＋角のマス (フォークが弧を描く斜め) が空でないと不可
 * - F/クリック: フォーク先の箱を積む / 積んでいればフォーク先に降ろす
 * - 緑ゾーンに箱を全部並べたらクリア。Z: アンドゥ / R: リセット
 * ステージは全5面 (ソルバーで解けることを検証済み、最短手数順)
 * 手数 = 有効な操作 (移動・転回・積み降ろし) の回数。ソルバーの数え方と同一。
 * クリア時ランク: S = 最短以内 / A = 最短×1.3 以内 / B = クリア
 */
const STAGE_MAPS = [
  [ // ステージ1: 箱3個 (最短34手)
    "##########",
    "#.....ZZZ#",
    "#..B.....#",
    "#....B...#",
    "#........#",
    "#..B.....#",
    "#........#",
    "#.F......#",
    "##########",
  ],
  [ // ステージ2: 箱4個 (最短46手)
    "##########",
    "#........#",
    "#.B....ZZ#",
    "#......ZZ#",
    "#...#....#",
    "#..B...B.#",
    "#........#",
    "#.F...B..#",
    "##########",
  ],
  [ // ステージ3: 箱6個 (最短52手)
    "##########",
    "#........#",
    "#..B..B..#",
    "#........#",
    "#.B...ZZZ#",
    "#.....ZZZ#",
    "#..B.....#",
    "#.F..B.B.#",
    "##########",
  ],
  [ // ステージ4: 箱5個・縦ゾーン (最短68手)
    "##########",
    "#........#",
    "#Z....B..#",
    "#Z.....B.#",
    "#Z..##.B.#",
    "#Z.......#",
    "#Z.B...B.#",
    "#.F......#",
    "##########",
  ],
  [ // ステージ5: 箱6個・壁で仕切られた倉庫 (解けることを検証済み、100手の解を確認)
    "##########",
    "#.B......#",
    "#.B..##..#",
    "#....#...#",
    "#..B.#ZZZ#",
    "#.....ZZZ#",
    "#...B....#",
    "#.F..B.B.#",
    "##########",
  ],
];
// 各ステージの最短手数 (ステージ1〜4はC版ソルバー tools/solve_pdb.c で
// 厳密に確定。ステージ5は探索空間が大きすぎて証明は未完だが、確認済みの
// 最速は100手で、2.4億状態の探索でもそれ未満の解は見つかっていない)
const STAGE_BEST = [34, 46, 52, 68, 100];
const MAP = STAGE_MAPS[2]; // 従来の単体マップ参照用 (ステージ3と同一)
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // 上右下左

function createGame(rows) {
  const mapRows = rows || MAP;
  const walls = new Set();
  const zone = [];
  let boxes = [];
  let body = [0, 0];
  let facing = 0;
  let carrying = false;
  let cleared = false;
  let history = [];

  for (let y = 0; y < mapRows.length; y++) {
    for (let x = 0; x < mapRows[y].length; x++) {
      const ch = mapRows[y][x];
      if (ch === "#") walls.add(x + "," + y);
      else if (ch === "Z") zone.push([x, y]);
      else if (ch === "B") boxes.push([x, y]);
      else if (ch === "F") body = [x, y];
    }
  }
  const initial = snapshot();

  function key(c) { return c[0] + "," + c[1]; }
  function hasBox(c) { return boxes.some(b => b[0] === c[0] && b[1] === c[1]); }
  function forkCell() { return [body[0] + DIRS[facing][0], body[1] + DIRS[facing][1]]; }
  function snapshot() {
    return { body: [...body], facing, carrying, boxes: boxes.map(b => [...b]) };
  }
  function restore(s) {
    body = [...s.body]; facing = s.facing; carrying = s.carrying;
    boxes = s.boxes.map(b => [...b]);
  }
  function pushHistory() {
    history.push(snapshot());
    if (history.length > 500) history.shift();
  }
  function checkClear() {
    if (boxes.length !== zone.length) return;
    if (zone.every(z => hasBox(z))) cleared = true;
  }

  function tryForward() {
    const dest = forkCell();
    if (walls.has(key(dest)) || hasBox(dest)) return;
    const nf = [dest[0] + DIRS[facing][0], dest[1] + DIRS[facing][1]];
    if (walls.has(key(nf))) return; // フォークが壁に刺さる前進は不可
    if (carrying && hasBox(nf)) return;
    pushHistory();
    body = dest;
  }
  function tryBackward() {
    const nb = [body[0] - DIRS[facing][0], body[1] - DIRS[facing][1]];
    if (walls.has(key(nb)) || hasBox(nb)) return;
    pushHistory();
    body = nb;
  }
  function tryTurn(fi) {
    const nf = [body[0] + DIRS[fi][0], body[1] + DIRS[fi][1]];
    if (walls.has(key(nf)) || hasBox(nf)) return;
    const diag = [body[0] + DIRS[facing][0] + DIRS[fi][0],
                  body[1] + DIRS[facing][1] + DIRS[fi][1]];
    if (walls.has(key(diag)) || hasBox(diag)) return; // 角のマスの当たり判定
    pushHistory();
    facing = fi;
  }
  function handleDir(d) {
    if (cleared) return;
    if (d === facing) tryForward();
    else if (d === (facing + 2) % 4) tryBackward();
    else tryTurn(d);
  }
  function interact() {
    if (cleared) return;
    const fc = forkCell();
    if (carrying) {
      if (walls.has(key(fc)) || hasBox(fc)) return;
      pushHistory();
      boxes.push(fc);
      carrying = false;
      checkClear();
    } else {
      if (!hasBox(fc)) return;
      pushHistory();
      boxes = boxes.filter(b => !(b[0] === fc[0] && b[1] === fc[1]));
      carrying = true;
    }
  }
  function undo() {
    if (history.length === 0) return;
    restore(history.pop());
    cleared = false;
  }
  function reset() {
    restore(initial);
    history = [];
    cleared = false;
  }

  return {
    handleDir, interact, undo, reset,
    get body() { return body; },
    get facing() { return facing; },
    get carrying() { return carrying; },
    get cleared() { return cleared; },
    get moves() { return history.length; },
    get boxes() { return boxes; },
    get zone() { return zone; },
    get walls() { return walls; },
    get rows() { return mapRows; },
  };
}

function rankFor(moves, best) {
  if (moves <= best) return "S";
  if (moves <= Math.floor(best * 1.3)) return "A";
  return "B";
}

if (typeof module !== "undefined") module.exports = { createGame, MAP, STAGE_MAPS, STAGE_BEST, DIRS, rankFor };
</script>
<script>"use strict";
/* フォークリフト倉庫パズル - ブラウザ描画 (Godot版の StackedSprite 描画を再現)
 * タイトル画面 (ステージ選択) -> プレイ -> クリアで次ステージへ、の流れを持つ。 */
const CELL = 48;
const SCALE = 1.5; // アート32単位 = 1マス
const ANGLES = [0, 90, 180, 270];

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const liftImgs = [], boxImgs = [];
let loaded = 0;
const totalImgs = SPRITES.forklift.length + SPRITES.box.length;
function onLoad() { if (++loaded === totalImgs) requestAnimationFrame(loop); }
SPRITES.forklift.forEach(u => { const i = new Image(); i.onload = onLoad; i.src = u; liftImgs.push(i); });
SPRITES.box.forEach(u => { const i = new Image(); i.onload = onLoad; i.src = u; boxImgs.push(i); });

// タイトル画面のフォークリフト立ち絵 (スプライトをそのまま積む)
(function buildTitleVisual() {
  const box = document.getElementById("title-visual");
  SPRITES.forklift.forEach((u, i) => {
    const img = document.createElement("img");
    img.src = u;
    img.alt = "";
    img.style.bottom = (i * 2) + "px";
    box.appendChild(img);
  });
})();
// 自己ベストランク (ブラウザに保存され、タイトル画面に表示される)
const RANK_ORDER = { S: 3, A: 2, B: 1 };
function rankColor(r) { return r === "S" ? "#ffd94d" : r === "A" ? "#a8e6b0" : "#e0a878"; }
let bestRanks = [];
try { bestRanks = JSON.parse(localStorage.getItem("forklift_best_ranks") || "[]"); } catch (e) { bestRanks = []; }
if (!Array.isArray(bestRanks)) bestRanks = [];
function saveRank(i, rank) {
  if ((RANK_ORDER[rank] || 0) > (RANK_ORDER[bestRanks[i]] || 0)) {
    bestRanks[i] = rank;
    try { localStorage.setItem("forklift_best_ranks", JSON.stringify(bestRanks)); } catch (e) {}
  }
  refreshProgress();
}

// ステージ選択ボタン
const stageBtnBadges = [];
(function buildStageButtons() {
  const box = document.getElementById("stage-btns");
  STAGE_MAPS.forEach((_, i) => {
    const b = document.createElement("button");
    b.appendChild(document.createTextNode("ステージ" + (i + 1)));
    const s = document.createElement("span");
    s.className = "badge";
    b.appendChild(s);
    stageBtnBadges.push(s);
    b.addEventListener("click", () => startStage(i));
    box.appendChild(b);
  });
})();

function refreshProgress() {
  stageBtnBadges.forEach((s, i) => {
    const r = bestRanks[i];
    s.textContent = r ? " ★" + r : "";
    s.style.color = r ? rankColor(r) : "";
  });
  const clearedCount = bestRanks.filter(Boolean).length;
  const sCount = bestRanks.filter(r => r === "S").length;
  document.getElementById("rank-progress").textContent = clearedCount
    ? "クリア済み " + clearedCount + " / " + STAGE_MAPS.length + "　Sランク " + sCount + " / " + STAGE_MAPS.length
    : "";
}
refreshProgress();

let screen = "title"; // "title" | "play"
let stageIdx = 0;
let game = createGame(STAGE_MAPS[0]);
let clearShown = false;
let lastMovesShown = -1;

function updateMovesLabel() {
  document.getElementById("moves-label").textContent =
    "手数 " + game.moves + "　最短 " + STAGE_BEST[stageIdx] + "手";
}

function cellCenter(c) { return [c[0] * CELL + CELL / 2, c[1] * CELL + CELL / 2]; }
let visPos = cellCenter(game.body);
let visAngle = 0;
let boxVis = game.boxes.map(b => cellCenter(b));
while (boxVis.length < 6) boxVis.push([0, 0]);

function startStage(i) {
  stageIdx = i;
  game = createGame(STAGE_MAPS[i]);
  visPos = cellCenter(game.body);
  visAngle = 0;
  boxVis = game.boxes.map(b => cellCenter(b));
  while (boxVis.length < 6) boxVis.push([0, 0]);
  clearShown = false;
  document.getElementById("stage-label").textContent =
    "ステージ " + (i + 1) + " / " + STAGE_MAPS.length + "（箱" + game.boxes.length + "個）";
  document.getElementById("goal-hint").textContent =
    "箱" + game.boxes.length + "個を緑のゾーンに全部並べたらクリア。車体＋フォークの2マスものなので、旋回には角の空きも必要。";
  document.getElementById("title-screen").style.display = "none";
  document.getElementById("clear").style.display = "none";
  lastMovesShown = -1;
  updateMovesLabel();
  screen = "play";
}

function goTitle() {
  screen = "title";
  document.getElementById("title-screen").style.display = "flex";
  document.getElementById("clear").style.display = "none";
}

function showClear() {
  const last = stageIdx >= STAGE_MAPS.length - 1;
  const best = STAGE_BEST[stageIdx];
  const rank = rankFor(game.moves, best);
  saveRank(stageIdx, rank);
  const rankEl = document.getElementById("clear-rank");
  rankEl.textContent = rank + "ランク";
  rankEl.style.color = rankColor(rank);
  document.getElementById("clear-moves").textContent =
    game.moves + "手でクリア（最短 " + best + "手）";
  document.getElementById("clear-title").textContent =
    last ? "全ステージクリア！" : "ステージクリア！";
  document.getElementById("clear-sub").textContent =
    last ? "倉庫は全部片付いた。おつかれさま！" : "倉庫が片付いた！";
  document.getElementById("btn-next").textContent =
    last ? "タイトルへ" : "次のステージへ →";
  document.getElementById("clear").style.display = "block";
}

function drawFloor() {
  const rows = game.rows;
  for (let y = 0; y < rows.length; y++) {
    for (let x = 0; x < rows[y].length; x++) {
      const px = x * CELL, py = y * CELL;
      if (game.walls.has(x + "," + y)) {
        ctx.fillStyle = "rgb(64,66,77)";
        ctx.fillRect(px, py, CELL, CELL);
        ctx.fillStyle = "rgb(97,102,115)";
        ctx.fillRect(px + 4, py + 4, CELL - 8, CELL - 8);
      } else {
        ctx.fillStyle = "rgb(158,163,171)";
        ctx.fillRect(px, py, CELL, CELL);
        ctx.strokeStyle = "rgba(0,0,0,0.08)";
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 0.5, py + 0.5, CELL - 1, CELL - 1);
      }
    }
  }
  for (const z of game.zone) {
    const px = z[0] * CELL, py = z[1] * CELL;
    ctx.fillStyle = "rgba(51,191,89,0.35)";
    ctx.fillRect(px + 3, py + 3, CELL - 6, CELL - 6);
    ctx.strokeStyle = "rgb(51,230,102)";
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 3, py + 3, CELL - 6, CELL - 6);
  }
}

function drawStack(imgs, cx, cy, angleDeg, from, count, baseLayer) {
  const rad = angleDeg * Math.PI / 180;
  for (let k = 0; k < count; k++) {
    const i = from + k;
    const img = imgs[i];
    ctx.save();
    ctx.translate(cx, cy - (baseLayer + i) * SCALE);
    ctx.rotate(rad);
    ctx.scale(SCALE, SCALE);
    ctx.drawImage(img, -img.width / 2, -img.height / 2);
    ctx.restore();
  }
}

function lerpAngle(a, b, w) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * w;
}

let lastT = performance.now();
function loop(t) {
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;
  const w = 1 - Math.pow(1e-7, dt);

  const target = cellCenter(game.body);
  visPos = [visPos[0] + (target[0] - visPos[0]) * w,
            visPos[1] + (target[1] - visPos[1]) * w];
  visAngle = lerpAngle(visAngle, ANGLES[game.facing] * Math.PI / 180, w);
  const visDeg = visAngle * 180 / Math.PI;

  drawFloor();
  // 地面の箱 (z順はGodot版と同じ: 箱 -> 車体)
  for (let i = 0; i < boxVis.length; i++) {
    if (i >= game.boxes.length) continue;
    const tc = cellCenter(game.boxes[i]);
    const dx = tc[0] - boxVis[i][0], dy = tc[1] - boxVis[i][1];
    if (Math.hypot(dx, dy) > CELL * 1.5) boxVis[i] = tc;
    else boxVis[i] = [boxVis[i][0] + dx * w, boxVis[i][1] + dy * w];
    drawStack(boxImgs, boxVis[i][0], boxVis[i][1], 0, 0, boxImgs.length, 0);
  }
  // 車体: 下層 (フォークの刃) -> 積荷 -> 上層 (マスト・屋根)
  drawStack(liftImgs, visPos[0], visPos[1], visDeg, 0, 6, 0);
  if (game.carrying) {
    const fx = Math.sin(visAngle), fy = -Math.cos(visAngle);
    drawStack(boxImgs, visPos[0] + fx * CELL, visPos[1] + fy * CELL, visDeg, 0, boxImgs.length, 5);
  }
  drawStack(liftImgs, visPos[0], visPos[1], visDeg, 6, liftImgs.length - 6, 0);

  if (screen === "play" && game.moves !== lastMovesShown) {
    lastMovesShown = game.moves;
    updateMovesLabel();
  }
  if (screen === "play" && game.cleared && !clearShown) {
    clearShown = true;
    showClear();
  }
  requestAnimationFrame(loop);
}

const KEYMAP = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
window.addEventListener("keydown", e => {
  if (screen === "title") {
    if (e.code === "Enter" || e.code === "Space") { startStage(0); e.preventDefault(); }
    return;
  }
  if (game.cleared && (e.code === "Enter" || e.code === "Space")) {
    if (stageIdx >= STAGE_MAPS.length - 1) goTitle(); else startStage(stageIdx + 1);
    e.preventDefault();
    return;
  }
  if (e.code in KEYMAP) { game.handleDir(KEYMAP[e.code]); e.preventDefault(); }
  else if (e.code === "KeyF") game.interact();
  else if (e.code === "KeyZ") { game.undo(); clearShown = game.cleared; if (!game.cleared) document.getElementById("clear").style.display = "none"; }
  else if (e.code === "KeyR") { game.reset(); document.getElementById("clear").style.display = "none"; clearShown = false; }
});
canvas.addEventListener("click", () => { if (screen === "play") game.interact(); });
document.querySelectorAll("[data-dir]").forEach(b =>
  b.addEventListener("click", () => { if (screen === "play") game.handleDir(Number(b.dataset.dir)); }));
document.getElementById("btn-f").addEventListener("click", () => { if (screen === "play") game.interact(); });
document.getElementById("btn-z").addEventListener("click", () => { if (screen === "play") { game.undo(); if (!game.cleared) { document.getElementById("clear").style.display = "none"; clearShown = false; } } });
document.getElementById("btn-r").addEventListener("click", () => { if (screen === "play") { game.reset(); document.getElementById("clear").style.display = "none"; clearShown = false; } });
document.getElementById("btn-next").addEventListener("click", () => {
  if (stageIdx >= STAGE_MAPS.length - 1) goTitle(); else startStage(stageIdx + 1);
});
document.getElementById("btn-title").addEventListener("click", goTitle);
document.getElementById("btn-start").addEventListener("click", () => startStage(0));
</script>
